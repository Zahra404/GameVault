<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Vault</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Moon+Dance&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel&family=Dancing+Script&family=Montserrat:ital,wght@0,100;0,200;1,200&family=Parisienne&display=swap" rel="stylesheet">
</head>

<body class="catalogue-page">
<div class="navbar top">
    <a th:href="@{/gameVault/home}" class="hrefGV">
        <h1 class="GameVaultTitle">Game Vault</h1>
    </a>
    <a th:href="@{/gameVault/login}" class="login">Login</a>
    <a th:href="@{/gameVault/register}" class="register">Register</a>

    <a href="bell.html">
        <div class="bell">
            <i class="bi bi-bell-fill"></i>
            <div id="bellAmount" class="bellAmount">0</div>
        </div>
    </a>

    <a href="chats.html">
        <div class="chats">
            <i class="bi bi-chat-square-dots-fill"></i>
            <div id="bellAmount" class="bellAmount">0</div>
        </div>
    </a>
</div>

<div>
    <h2>Search</h2>
    <input type="text" class="saerchBar" placeholder="Search by title, keyword or date">
</div>
<div class="shop" id="shop" style="display: flex; justify-content: flex-start;">

    <div class="game-list">
        <a th:href="@{/gameVault/Adiboo}"><img th:src="@{/img/Adiboo.jpg}" alt="Adiboo" class="card-img-top"></a>
        <a th:href="@{/gameVault/MilknNuts}"><img th:src="@{/img/MilknNuts.jpg}" alt="milknNuts" class="card-img-top"></a>
        <a th:href="@{/gameVault/Apex}"><img th:src="@{/img/Apex.jpg}" alt="Apex" class="card-img-top"></a>
        <a th:href="@{/gameVault/Spyro}"><img th:src="@{/img/Spyro.jpg}" alt="Spyro" class="card-img-top"></a>
        <a th:href="@{/gameVault/Skyrim}"><img th:src="@{/img/Skyrim.jpg}" alt="Skyrim" class="card-img-top"></a>
        <a th:href="@{/gameVault/Rayman}"><img th:src="@{/img/Rayman.jpg}" alt="Rayman" class="card-img-top"></a>
        <a th:href="@{/gameVault/Ark}"><img th:src="@{/img/Ark.jpg}" alt="Ark" class="card-img-top"></a>
        <a th:href="@{/gameVault/AssassinsCreed}"><img th:src="@{/img/AssassinCreed.avif}" alt="AC" class="card-img-top"></a>
        <a th:href="@{/gameVault/CircusCharlie}"><img th:src="@{/img/CircusCharlie.jpg}" alt="CC" class="card-img-top"></a>
        <a th:href="@{/gameVault/CODwm}"><img th:src="@{/img/CODwm4.jpg}" alt="CODmw4" class="card-img-top"></a>
        <a th:href="@{/gameVault/Contra}"><img th:src="@{/img/ContraAlienWars.jpg}" alt="Contra" class="card-img-top"></a>
        <a th:href="@{/gameVault/Fortnite}"><img th:src="@{/img/fortnite.jpg}" alt="fortnite" class="card-img-top"></a>
        <a th:href="@{/gameVault/GenshinImpact}"><img th:src="@{/img/GenshinImpact.jpg}" alt="GenshinImpact" class="card-img-top"></a>
        <a th:href="@{/gameVault/GhostOfTsishima}"><img th:src="@{/img/ghostoftsishima.jpg}" alt="Got" class="card-img-top"></a>

    </div>

    <button class="open-button" onclick="openForm()">Add New Game</button>

    <div class="form-popup" id="myForm">
        <form action="/action_page.php" class="form-container">
            <h1>Login</h1>

            <label for="gameName"><b>Game Name</b></label>
            <input type="text" placeholder="Enter Game" name="game" required>

            <label for="gameDescription"><b>Game Description</b></label>
            <input type="text" placeholder="Enter Description" name="desc" required>

            <label for="image"><b>image</b></label>
            <input type="text" placeholder="Enter image" name="img" required>

            <label for="date"><b>Game Release Date</b></label>
            <input type="text" placeholder="Enter release date" name="date" required>

            <button type="submit" class="btn">Add Game</button>
            <button type="button" class="btn cancel" onclick="closeForm()">Close</button>
        </form>
    </div>
</div>

<div class="last">

    <h3 class="getInTouch">Get in Touch</h3>
    <a href="">
        <img class="inst" src="/img/iconfinder_instagram_6636603.png" alt="instagram">
    </a>
    <a href="mailto:">
        <img class="mail" src="/img/iconfinder_gmail_132837.png" alt="gmail">
    </a>
    <p class="copyright">© 2026 Game Vault </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    function openForm() {
        document.getElementById("myForm").style.display = "block";
    }

    function closeForm() {
        document.getElementById("myForm").style.display = "none";
    }
</script>
</body>
<script src="src/Data.js"></script>
<script src="src/main.js"></script>
<script src="catalogue.html"></script>


</html>
