<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Vault</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Moon+Dance&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel&family=Dancing+Script&family=Montserrat:ital,wght@0,100;0,200;1,200&family=Parisienne&display=swap" rel="stylesheet">
</head>

<body>
<div class="navbar top">
    <a th:href="@{/gameVault/home}">
        <h1 style="text-shadow: 2px 2px #39ff14; font-family: Parisienne, cursive; font-size: 50px; color: black;">Game Vault</h1>
    </a>
    <a th:href="@{/gameVault/login}">Login</a>
    <a th:href="@{/gameVault/register}">Register</a>

    <a href="bell.html">
        <div class="bell">
            <i class="bi bi-bell-fill"></i>
            <div id="bellAmount" class="bellAmount">0</div>
        </div>
    </a>

    <a href="chats.html">
        <div class="chats">
            <i class="bi bi-chat-square-dots-fill"></i>
            <div id="bellAmount" class="bellAmount">0</div>
        </div>
    </a>
</div>



<div class="shop" id="shop" style="display: flex; justify-content: flex-start;">
    <div class="card" style="width: 10rem;">
        <img th:src="@{/img/Adiboo.jpg}" class="card-img-top" alt="Adiboo game">
        <div class="card-body">
            <h5 class="card-title">Adiboo</h5>
            <p class="card-text">follow Adiboo, a young alien who teaches children about a variety of topics including
                nature, maths, and language. Most stories are set in the world of Celesta.</p>
            <a th:href="@{/gameVault/Adiboo}" class="btn btn-primary">View</a>
        </div>
    </div>
    <button class="open-button" onclick="openForm()"><i class="bi bi-plus"></i></button>

    <div class="form-popup" id="myForm">
        <form action="/action_page.php" class="form-container">
            <h1>Login</h1>

            <label for="gameName"><b>Game Name</b></label>
            <input type="text" placeholder="Enter Game" name="game" required>

            <label for="gameDescription"><b>Game Description</b></label>
            <input type="text" placeholder="Enter Description" name="desc" required>

            <label for="image"><b>image</b></label>
            <input type="text" placeholder="Enter image" name="img" required>

            <label for="date"><b>Game Release Date</b></label>
            <input type="text" placeholder="Enter release date" name="date" required>

            <button type="submit" class="btn">Add Game</button>
            <button type="button" class="btn cancel" onclick="closeForm()">Close</button>
        </form>
    </div>
</div>

<div class="last">

    <h3 class="getInTouch">Get in Touch</h3>
    <a href="">
        <img class="inst" src="/img/iconfinder_instagram_6636603.png" alt="instagram">
    </a>
    <a href="mailto:">
        <img class="mail" src="/img/iconfinder_gmail_132837.png" alt="gmail">
    </a>
    <p class="copyright">© 2026 Game Vault </p>

</div>

<script>
    function openForm() {
        document.getElementById("myForm").style.display = "block";
    }

    function closeForm() {
        document.getElementById("myForm").style.display = "none";
    }
</script>
</body>
<script src="src/Data.js"></script>
<script src="src/main.js"></script>
<script src="catalogue.html"></script>


</html>
